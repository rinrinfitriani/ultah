<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surat Ucapan Romantis</title>
  <!-- Google Fonts: Caveat (Tulisan tangan estetik) -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e0e5ff; /* Warna latar belakang sesuai gambar */
      font-family: 'Caveat', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container Utama Amplop */
    .envelope-wrapper {
      position: relative;
      cursor: pointer;
      margin-top: 50px;
    }

        /* Struktur Wadah Amplop (Bentuk Dasar) */
    .envelope {
      position: relative;
      width: 280px;
      height: 190px;
      background-color: #a81c24; /* Warna merah amplop */
      border-radius: 0 0 10px 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    /* Penutup Amplop Atas (Segitiga Lipatan) */
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 110px solid #c9242d; /* Warna lipatan atas */
      transform-origin: top;
      transition: transform 0.5s ease 0.5s, z-index 0.2s ease 0.5s;
      z-index: 5;
    }

    /* Lipatan Samping & Bawah Amplop */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid #b82028;
      border-right: 140px solid #b82028;
      border-bottom: 100px solid #8e151b;
      border-radius: 0 0 10px 10px;
      z-index: 4;
    }

    /* Kertas Surat di Dalam Amplop */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 250px;
      height: 170px;
      background: #ffffff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.6s ease-in-out, height 0.6s ease-in-out;
      z-index: 2;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .letter-heart {
      font-size: 2rem;
      color: #d32f2f;
      margin-bottom: 5px;
    }

    .letter-title {
      font-size: 1.8rem;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }

    .letter-text {
      font-size: 1.3rem;
      color: #555;
      line-height: 1.3;
    }

    /* --- ANIMASI KETIKA AMPLOP DIKLIK (.open) --- */

    /* 1. Lipatan atas terbuka */
    .envelope-wrapper.open .envelope::before {
      transform: rotateX(180deg);
      z-index: 1; /* Pindah ke belakang saat terbuka */
      transition: transform 0.5s ease, z-index 0.1s ease 0.5s;
    }

    /* 2. Kertas surat keluar ke atas dan membesar */
    .envelope-wrapper.open .letter {
      transform: translateY(-130px);
      height: 240px;
      z-index: 3; /* Naik ke atas lipatan depan */
      transition: transform 0.6s ease-in-out 0.4s, height 0.6s ease-in-out 0.4s;
    }

    /* Tombol Navigasi / Reset di Bawah */
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 100px;
    }

    .btn-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid #7d8fb3;
      background-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #55688a;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-icon:hover {
      background-color: rgba(255, 255, 255, 0.5);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Kontainer Amplop -->
  <div class="envelope-wrapper" id="envelopeWrapper" onclick="toggleEnvelope()">
    
    <!-- Badan Amplop -->
    <div class="envelope">
      
      <!-- Kertas Surat yang akan keluar -->
      <div class="letter">
        <div class="letter-heart">♡</div>
        <div class="letter-title">Suamiku Tercinta</div>
        <div class="letter-text">
          Terima kasih sudah selalu ada.<br>
          Semoga harimu selalu penuh dengan kebahagiaan dan senyuman! :)
        </div>
      </div>

      <!-- Lipatan Kantong Depan Amplop -->
      <div class="envelope-pocket"></div>
    </div>
  </div>

  <!-- Tombol Reset & Kembali (Sesuai Gambar) -->
  <a href="menu.html"><img src="arrow.png" style="width: 40px; height: auto;"></a>

  <script>
    const envelopeWrapper = document.getElementById('envelopeWrapper');

    // Fungsi untuk membuka / menutup surat saat diklik
    function toggleEnvelope() {
      envelopeWrapper.classList.toggle('open');
    }

  </script>

</body>
</html>
