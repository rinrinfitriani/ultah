<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Musik Romantis</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Caveat & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f4f0eb;
        } 

        .font-handwritten {
            font-family: 'Caveat', cursive;
        }

        /* Continuous vinyl rotation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-spin {
            animation: spin 5s linear infinite;
        }

        .vinyl-paused {
            animation-play-state: paused;
        }

        /* Floating musical notes animation */
        @keyframes floatNotes {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-8px) rotate(5deg); opacity: 1; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
        }

        .floating-notes {
            animation: floatNotes 3s ease-in-out infinite;
        }

        /* Equalizer bar animation */
        @keyframes bounceBar {
            0%, 100% { height: 4px; }
            50% { height: 20px; }
        }

        .eq-bar {
            width: 3px;
            background-color: #fca5a5;
            border-radius: 2px;
            height: 4px;
            transition: height 0.2s ease;
        }

        .eq-playing .bar-1 { animation: bounceBar 0.6s ease-in-out infinite 0.1s; }
        .eq-playing .bar-2 { animation: bounceBar 0.8s ease-in-out infinite 0.3s; }
        .eq-playing .bar-3 { animation: bounceBar 0.5s ease-in-out infinite 0.2s; }
        .eq-playing .bar-4 { animation: bounceBar 0.7s ease-in-out infinite 0.4s; }
        .eq-playing .bar-5 { animation: bounceBar 0.6s ease-in-out infinite 0.15s; }

        /* Custom Crayon Texture styling */
        .player-card {
            background: linear-gradient(135deg, #a04938 0%, #893828 100%);
            box-shadow: 0 10px 25px -5px rgba(137, 56, 40, 0.4);
        }

        /* Heart sparkle animation */
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .heart-beat {
            animation: heartBeat 1.2s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Mobile Outer Frame Container -->
    <div class="w-full max-w-sm bg-[#faf8f5] rounded-[36px] p-6 shadow-2xl border border-stone-200 relative overflow-hidden my-auto min-h-[680px] flex flex-col justify-between items-center">

        <!-- Header / Decorative Musical Notes Canvas -->
        <div class="w-full flex flex-col items-center pt-2 relative">
            <div class="w-full h-24 relative floating-notes flex items-center justify-center">
                <!-- SVG Musical Staves & Floating Notes -->
                <svg viewBox="0 0 300 80" class="w-full h-full text-stone-500 stroke-current fill-none">
                    <!-- Music Stave Lines -->
                    <path d="M 30,30 Q 150,10 270,30" stroke-width="1.2" opacity="0.4"/>
                    <path d="M 30,36 Q 150,16 270,36" stroke-width="1.2" opacity="0.4"/>
                    <path d="M 30,42 Q 150,22 270,42" stroke-width="1.2" opacity="0.4"/>
                    
                    <!-- Clef and Notes -->
                    <g fill="currentColor" stroke="none">
                        <!-- Treble Clef Symbol -->
                        <text x="35" y="48" font-size="28" font-family="serif">🎼</text>
                        <text x="100" y="28" font-size="16">🎵</text>
                        <text x="150" y="20" font-size="18">🎶</text>
                        <text x="210" y="25" font-size="15">🎵</text>
                        <text x="250" y="35" font-size="14">♩</text>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Music Player Main Component -->
        <div class="relative w-full my-4 flex justify-center">
            
            <!-- Vinyl Record (Positioned behind player card to slide out / peek) -->
            <div id="vinylRecord" class="absolute right-1 top-3 w-36 h-36 rounded-full bg-stone-900 border-4 border-stone-800 flex items-center justify-center shadow-lg transition-transform duration-500 z-0 vinyl-spin vinyl-paused">
                <!-- Vinyl Grooves -->
                <div class="w-28 h-28 rounded-full border border-stone-700/50 flex items-center justify-center">
                    <div class="w-20 h-20 rounded-full border border-stone-700/40 flex items-center justify-center">
                        <!-- Center Label -->
                        <div class="w-12 h-12 rounded-full bg-red-800 border-2 border-stone-900 flex items-center justify-center">
                            <div class="w-3 h-3 rounded-full bg-amber-100"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Player Retro Body -->
            <div class="player-card w-[88%] rounded-2xl p-3 z-10 text-white relative flex flex-col justify-between h-44">
                
                <div class="flex items-center space-x-3">
                    <!-- Album Cover Screen (Left Side) -->
                    <div class="w-24 h-28 rounded-xl bg-gradient-to-b from-amber-200 to-lime-300 p-1 flex flex-col justify-between items-center relative overflow-hidden shadow-inner border border-amber-300/40">
                        <!-- Headphone Graphic -->
                        <i class="fa-solid fa-headphones text-stone-700 text-lg mt-2"></i>
                        <!-- Hill / Green Landscape Artwork -->
                        <div class="w-full h-12 bg-lime-600 rounded-b-lg relative flex items-end justify-center">
                            <div class="w-16 h-8 bg-lime-500 rounded-full -mb-2"></div>
                        </div>
                    </div>

                    <!-- Right Side Player Controls & Details -->
                    <div class="flex-1 flex flex-col justify-between h-28 py-0.5 pr-1">
                        <!-- Title & Equalizer Section -->
                        <div>
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-xs text-amber-100 tracking-wide uppercase">Cinta Sejati</h3>
                                    <p class="text-[10px] text-amber-200/80">Melodi Romantis</p>
                                </div>
                                <!-- Heart Button -->
                                <button id="heartBtn" class="text-xs text-amber-200/70 hover:text-red-300 transition-colors">
                                    <i class="fa-solid fa-heart" id="heartIcon"></i>
                                </button>
                            </div>

                            <!-- Animated Visualizer Bars -->
                            <div id="equalizer" class="flex items-end space-x-1 h-5 mt-2">
                                <div class="eq-bar bar-1"></div>
                                <div class="eq-bar bar-2"></div>
                                <div class="eq-bar bar-3"></div>
                                <div class="eq-bar bar-4"></div>
                                <div class="eq-bar bar-5"></div>
                            </div>
                        </div>

                        <!-- Progress Bar & Play Control -->
                        <div class="space-y-1">
                            <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full h-1 bg-amber-900/60 rounded-lg appearance-none cursor-pointer accent-amber-300">
                            
                            <div class="flex justify-between items-center text-[9px] text-amber-200/80 pt-0.5">
                                <span id="currentTime">0:00</span>
                                
                                <!-- Play / Pause Button -->
                                <button id="playBtn" class="w-7 h-7 rounded-full bg-amber-100 text-amber-900 flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-md">
                                    <i class="fa-solid fa-play text-xs ml-0.5" id="playIcon"></i>
                                </button>
                                
                                <span id="duration">0:00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Subtle Decorative Knobs -->
                <div class="flex justify-end space-x-2 px-1 pt-1 opacity-60">
                    <div class="w-1.5 h-1.5 rounded-full bg-amber-200"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-amber-200"></div>
                </div>
            </div>

        </div>

        <!-- Romantic Message Section -->
        <div class="px-3 text-center my-4">
            <p class="font-handwritten text-xl text-stone-700 leading-relaxed">
                Semoga saat <b>PAPIH</b> memutar musik ini, harimu terasa lebih hangat, lebih ringan, dan penuh dengan kebahagiaan.
            </p>
            <p class="font-handwritten text-2xl text-rose-500 font-semibold mt-1">
                Tersenyumlah Suamiku <span class="inline-block heart-beat">❤️</span>
            </p>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex space-x-4 mb-2">
            <!-- Replay/Refresh Button -->
            <button id="resetBtn" class="w-10 h-10 rounded-full border border-sky-300 bg-sky-50 text-sky-500 flex items-center justify-center shadow-sm hover:bg-sky-100 active:scale-90 transition-all">
                <i class="fa-solid fa-rotate-right text-sm"></i>
            </button>
            
            <!-- Previous/Next Action Button -->
           <a href="menu.html">
            <button id="prevBtn" class="w-10 h-10 rounded-full border border-sky-300 bg-sky-50 text-sky-500 flex items-center justify-center shadow-sm hover:bg-sky-100 active:scale-90 transition-all">
                <i class="fa-solid fa-angles-left text-sm"></i>
            </button></a>
        </div>

        <!-- Hidden Audio Element -->
        <audio id="audioPlayer" preload="metadata">
            <!-- Royalty Free Sweet Acoustic Music Track -->
            <source src="audio.mp4" type="audio/mpeg">
            Browser Anda tidak mendukung elemen audio.
        </audio>

    </div>

    <script>
        // DOM Elements setup
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const vinylRecord = document.getElementById('vinylRecord');
        const equalizer = document.getElementById('equalizer');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const heartBtn = document.getElementById('heartBtn');
        const heartIcon = document.getElementById('heartIcon');
        const resetBtn = document.getElementById('resetBtn');

        let isPlaying = false;

        // Toggle Play and Pause functionality
        function togglePlay() {
            if (isPlaying) {
                pauseMusic();
            } else {
                playMusic();
            }
        }

        function playMusic() {
            isPlaying = true;
            audio.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
            
            // Activate vinyl rotation animation
            vinylRecord.classList.remove('vinyl-paused');
            // Activate Equalizer movement
            equalizer.classList.add('eq-playing');
        }

        function pauseMusic() {
            isPlaying = false;
            audio.pause();
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            
            // Pause vinyl rotation animation
            vinylRecord.classList.add('vinyl-paused');
            // Pause Equalizer movement
            equalizer.classList.remove('eq-playing');
        }

        // Format Seconds to MM:SS format
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Update progress bar as audio plays
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        // Set Duration when audio metadata is loaded
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        // Manual seek through progress bar
        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                const seekTime = (progressBar.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            }
        });

        // Toggle Heart / Favorites
        let isLiked = false;
        heartBtn.addEventListener('click', () => {
            isLiked = !isLiked;
            if (isLiked) {
                heartIcon.classList.remove('text-amber-200/70');
                heartIcon.classList.add('text-rose-400');
            } else {
                heartIcon.classList.add('text-amber-200/70');
                heartIcon.classList.remove('text-rose-400');
            }
        });

        // Replay / Reset Button Event
        resetBtn.addEventListener('click', () => {
            audio.currentTime = 0;
            playMusic();
        });

        // Reset state when song ends
        audio.addEventListener('ended', () => {
            pauseMusic();
            progressBar.value = 0;
            currentTimeEl.textContent = "0:00";
        });

        // Attach click listener to main play button
        playBtn.addEventListener('click', togglePlay);
    </script>
</body>
</html>
